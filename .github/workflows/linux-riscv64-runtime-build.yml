name: linux-riscv64 dotnet-runtime build

on:
  workflow_dispatch:
    inputs:
      runtimeForkName:
        description: fork
        required: true
        default: dotnet
      runtimeBranchName:
        description: branch
        required: true
        default: main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checked
            config: Debug
            runtimeConfig: Checked
            testhostConfig: Debug

          - name: release
            config: Release
            testhostConfig: Release

    name: ${{ matrix.name }}

    steps:
    - name: Display workflow and matrix inputs
      run: |
        echo "runtimeForkName: ${{ github.event.inputs.runtimeForkName }}"
        echo "runtimeBranchName: ${{ github.event.inputs.runtimeBranchName }}"
        echo "matrix.name: ${{ matrix.name }}"
        echo "matrix.config: ${{ matrix.config }}"
        echo "matrix.runtimeConfig: ${{ matrix.runtimeConfig }}"
        echo "matrix.testhostConfig: ${{ matrix.testhostConfig }}"

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        android: true
        dotnet: true
        large-packages: false
        swap-storage: true
        tools-cache: true

    - name: Build runtime and library tests
      run: |
        git clone https://github.com/${{ github.event.inputs.runtimeForkName }}/runtime \
          --branch ${{ github.event.inputs.runtimeBranchName }} \
          --single-branch \
          --depth 1

        echo "git HEAD is at: $(git -C runtime rev-parse HEAD)"

        docker run --rm \
          -v$(pwd)/runtime:/runtime \
          -e ROOTFS_DIR=/crossrootfs/riscv64 \
          -e CONFIG=${{ matrix.config }} \
          -e RUNTIME_CONFIG=${{ matrix.runtimeConfig }} \
          mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net11.0-cross-riscv64 \
          sh -c '
          if [ -n "$RUNTIME_CONFIG" ]; then
            CONFIG_ARGS="-c $CONFIG -rc $RUNTIME_CONFIG"
          else
            CONFIG_ARGS="-c $CONFIG"
          fi

          /runtime/build.sh clr+libs -ci -arch riscv64 -cross $CONFIG_ARGS --bootstrap &&
          /runtime/build.sh libs.tests -ci -arch riscv64 -cross $CONFIG_ARGS --use-bootstrap -p:ArchiveTests=true
          '

    - name: Run library test suites in qemu
      run: |
        docker run --privileged --rm tonistiigi/binfmt --install all

        docker run --rm \
          --platform linux/riscv64 \
          -v$(pwd)/runtime:/runtime \
          -e CONFIG=${{ matrix.config }} \
          -e RUNTIME_CONFIG=${{ matrix.runtimeConfig }} \
          -e TESTHOST_CONFIG=${{ matrix.testhostConfig }} \
          ubuntu:24.04 \
          bash -c '
          set +e

          apt update
          apt install -y unzip libicu-dev

          RUNTIME_PATH="/runtime/artifacts/bin/testhost/net11.0-linux-${TESTHOST_CONFIG}-riscv64"

          echo "Runtime path: $RUNTIME_PATH"

          TEST_ROOT=/runtime/artifacts/helix/tests

          mapfile -t TEST_ZIPS < <(find "$TEST_ROOT" -name "*.zip" | sort)

          TOTAL=${#TEST_ZIPS[@]}
          CURRENT=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          echo "Total suites: $TOTAL"

          for ZIP in "${TEST_ZIPS[@]}"; do
            CURRENT=$((CURRENT + 1))

            SUITE=$(basename "$ZIP" .zip)

            echo
            echo "[$CURRENT/$TOTAL] $SUITE"

            case "$SUITE" in
              ComInterfaceGenerator.Unit.Tests|LibraryImportGenerator.Unit.Tests)
                echo "[SKIP] $SUITE"
                SKIPPED=$((SKIPPED + 1))
                continue
                ;;
            esac

            WORKDIR=/tmp/$SUITE

            rm -rf "$WORKDIR"
            mkdir -p "$WORKDIR"

            unzip -q "$ZIP" -d "$WORKDIR"

            if [ ! -f "$WORKDIR/RunTests.sh" ]; then
              echo "[FAIL] RunTests.sh missing"
              FAILED=$((FAILED + 1))
              continue
            fi

            (
              cd "$WORKDIR"
              chmod +x RunTests.sh
              ./RunTests.sh --runtime-path "$RUNTIME_PATH"
            )

            RESULT=$?

            if [ "$RESULT" -eq 0 ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done

          echo
          echo "===================="
          echo "Total suites : $TOTAL"
          echo "Passed       : $PASSED"
          echo "Failed       : $FAILED"
          echo "Skipped      : $SKIPPED"
          echo "===================="

          [ "$FAILED" -eq 0 ]
          '
